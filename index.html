<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entre Estudiantes</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<style>
  /* ===== CURSOR GLOW ===== */
.cursor-glow{
  position:fixed;
  width:200px;
  height:200px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle, rgba(183,255,0,0.15), transparent 70%);
  transform:translate(-50%,-50%);
  z-index:0;
}

/* ===== CARDS 3D PRO ===== */
.card{
  transform-style:preserve-3d;
  transition:transform .15s ease, box-shadow .2s ease;
}

.card:hover{
  box-shadow:0 30px 60px rgba(0,0,0,0.6);
}

/* ===== ORB FLOAT ===== */
@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-20px)}
  100%{transform:translateY(0)}
}

.orb{
  animation:float 6s ease-in-out infinite;
}

/* ===== HERO PARALLAX ===== */
.hero{
  perspective:1000px;
}

/* ===== BASE ORIGINAL ===== */
body{
  margin:0;
  font-family:system-ui;
  color:white;
  background:linear-gradient(135deg,#000,#0b1220,#020617);
  overflow-x:hidden;
}

/* ===== NUEVO: PARTICULAS ===== */
#particles{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

/* ===== NUEVO: GLOW ===== */
.cursor-glow{
  position:fixed;
  width:200px;
  height:200px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle, rgba(183,255,0,0.15), transparent 70%);
}

/* ===== NAV ===== */
.nav{
  display:flex;
  justify-content:space-between;
  padding:20px;
  background:rgba(0,0,0,0.5);
}

/* ===== SECCIONES ===== */
.section{
  display:none;
  padding:50px;
}
.section.active{
  display:block;
}

/* ===== HERO ===== */
.hero h1{
  font-size:80px;
}
.hero span{
  color:#b7ff00;
}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
}

/* ===== CARDS (CON IMAGEN + DESC) ===== */
.card{
  background:#111;
  border-radius:15px;
  overflow:hidden;
  transform-style:preserve-3d;
  transition:.2s;
}

.card img{
  width:100%;
  height:150px;
  object-fit:cover;
}

.card .info{
  padding:10px;
}

.card h4{
  color:#b7ff00;
}

.card p{
  font-size:14px;
  opacity:.8;
}

/* ===== PLAYER ===== */
.player{
  position:fixed;
  bottom:0;
  width:100%;
  background:rgba(0,0,0,0.6);
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .hero h1{font-size:40px}
}

</style>
</head>

<body>
  <canvas id="particles"></canvas>
<div class="cursor-glow"></div>

<!-- NUEVO -->
<canvas id="particles"></canvas>
<div class="cursor-glow"></div>

<div class="nav">
  <div>🎧 Entre Estudiantes</div>
  <div>
    <span onclick="showSection('inicio')">Inicio</span>
    <span onclick="showSection('episodios')">Episodios</span>
    <span onclick="showSection('subir')">Subir</span>
    <span onclick="showSection('nosotros')">Nosotros</span>
  </div>
</div>

<!-- INICIO -->
<section id="inicio" class="section active">
  <div class="hero">
    <h1>ENTRE <span>ESTUDIANTES</span></h1>
  </div>
</section>

<!-- EPISODIOS -->
<section id="episodios" class="section">
  <h2>Episodios</h2>
  <div id="podcasts" class="grid"></div>
</section>

<!-- SUBIR -->
<section id="subir" class="section">
  <h2>Subir</h2>
  <input id="title" placeholder="Título"><br>
  <input id="audioURL" placeholder="MP3"><br>
  <input id="imageURL" placeholder="Imagen"><br>
  <input id="desc" placeholder="Descripción"><br>
  <button onclick="addPodcast()">Subir</button>
</section>

<!-- NOSOTROS (NO SE TOCA) -->
<section id="nosotros" class="section">
  <h2>Nosotros</h2>

  <p>Somos estudiantes de medicina de tercer semestre...</p>

  <h3>Misión</h3>
  <p>Crear un espacio de apoyo académico y emocional.</p>

  <h3>Visión</h3>
  <p>Ser un referente en educación médica.</p>
</section>

<div class="player">
  <audio id="audioPlayer" controls></audio>
</div>

<script>

/* ===== FIREBASE ===== */
firebase.initializeApp({
 apiKey:"AIza...",
 authDomain:"entre-estudiantes.firebaseapp.com",
 projectId:"entre-estudiantes"
});
const db=firebase.firestore();

/* ===== NAV ===== */
function showSection(id){
 document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}

/* ===== GLOW ===== */
const glow=document.querySelector(".cursor-glow");
document.addEventListener("mousemove",e=>{
 glow.style.left=e.clientX+"px";
 glow.style.top=e.clientY+"px";
});

/* ===== PARTICULAS ===== */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<60;i++){
 particles.push({
  x:Math.random()*canvas.width,
  y:Math.random()*canvas.height,
  dx:0.3, dy:0.3
 });
}

function animate(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 particles.forEach(p=>{
  p.x+=p.dx;
  p.y+=p.dy;
  ctx.fillStyle="#b7ff00";
  ctx.fillRect(p.x,p.y,2,2);
 });
 requestAnimationFrame(animate);
}
animate();

/* ===== SUBIR ===== */
function addPodcast(){
 db.collection("podcasts").add({
  title:title.value,
  url:audioURL.value,
  image:imageURL.value,
  desc:desc.value,
  time:Date.now()
 });
}

/* ===== LISTAR (CON IMAGEN + DESC) ===== */
db.collection("podcasts").orderBy("time","desc")
.onSnapshot(snap=>{
 podcasts.innerHTML="";
 snap.forEach(doc=>{
  const d=doc.data();

  podcasts.innerHTML+=`
  <div class="card" onclick="play('${d.url}')">
    <img src="${d.image}">
    <div class="info">
      <h4>${d.title}</h4>
      <p>${d.desc}</p>
    </div>
  </div>`;
 });
});

/* ===== PLAYER ===== */
function play(url){
 const a=document.getElementById("audioPlayer");
 a.src=url;
 a.play();
}
/* ===== CURSOR GLOW ===== */
const glow = document.querySelector(".cursor-glow");

document.addEventListener("mousemove", e=>{
  glow.style.left = e.clientX + "px";
  glow.style.top  = e.clientY + "px";
});

/* ===== PARTICULAS ===== */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<80;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:2,
    dx:(Math.random()-0.5)*0.5,
    dy:(Math.random()-0.5)*0.5
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    p.x+=p.dx;
    p.y+=p.dy;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle="#b7ff00";
    ctx.fill();
  });

  requestAnimationFrame(animate);
}

animate();

/* ===== CARDS 3D ===== */
document.addEventListener("mousemove", e=>{
  document.querySelectorAll(".card").forEach(card=>{
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const rx = -(y - rect.height/2)/25;
    const ry = (x - rect.width/2)/25;

    card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
  });
});
</script>

</body>
</html>
