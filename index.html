<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entre Estudiantes</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<style>

/* ===== SCROLL SUAVE GLOBAL ===== */
html{
  scroll-behavior:smooth;
}

/* ===== GENERAL ===== */
body{
  margin:0;
  font-family:Arial;
  background: radial-gradient(circle at 20% 20%, #1a0033, #000);
  color:white;
}

/* ===== NAV ===== */
.nav{
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  background:black;
  align-items:center;
}

.menu span{
  margin:0 15px;
  cursor:pointer;
  font-size:18px;
  transition:0.3s;
}

.menu span:hover{
  color:#b7ff00;
}

/* ===== SECCIONES ===== */
.section{
  display:none;
  padding:50px;
  opacity:0;
  transform:translateY(40px);
  transition:all 0.6s ease;
}

.active{
  display:block;
  opacity:1;
  transform:translateY(0);
}

/* ===== HERO ===== */
.hero{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:50px;
}

.hero-text h1{
  font-size:90px;
}

.hero-text span{
  color:#b7ff00;
  text-shadow:0 0 25px #b7ff00;
}

.hero-text p{
  font-size:22px;
}

/* ===== LOGO ===== */
.uni-container{
  perspective:1000px;
}

.uni-img{
  width:520px;
  transition: transform 0.2s;
}

/* ===== CÍRCULO ===== */
.circle{
  width:300px;
  height:300px;
  border-radius:50%;
  background: radial-gradient(circle, #ff00ff, #5a00ff);
  box-shadow:0 0 80px #ff00ff;
}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:25px;
}

/* ===== CARDS ===== */
.card{
  background:#1a1a1a;
  border-radius:15px;
  overflow:hidden;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
}

/* ===== ANIMACIÓN SCROLL ===== */
.fade-in{
  opacity:0;
  transform:translateY(50px);
  transition:all 0.8s ease;
}

.fade-in.visible{
  opacity:1;
  transform:translateY(0);
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .hero{
    flex-direction:column;
    text-align:center;
  }

  .hero-text h1{
    font-size:45px;
  }

  .uni-img{
    width:90%;
  }

  .grid{
    grid-template-columns:1fr;
  }
}

</style>
</head>

<body>

<div class="nav">
  <div style="font-size:22px;">🎧 Entre Estudiantes</div>
  <div class="menu">
    <span onclick="show('inicio')">Inicio</span>
    <span onclick="show('episodios')">Episodios</span>
    <span onclick="show('subir')">Subir</span>
    <span onclick="show('nosotros')">Nosotros</span>
    <span onclick="show('comunidad')">Comunidad</span>
  </div>
</div>

<!-- INICIO -->
<div id="inicio" class="section active fade-in">
  <div class="hero">

    <div>
      <h1>ENTRE <span>ESTUDIANTES</span></h1>
      <p>Tu voz. Tu historia. Tu podcast.</p>

      <div class="uni-container">
        <img class="uni-img" src="download.png">
      </div>
    </div>

    <div class="circle"></div>

  </div>
</div>

<!-- EPISODIOS -->
<div id="episodios" class="section fade-in">
  <h2>Episodios</h2>
  <div id="podcasts" class="grid"></div>
</div>

<!-- SUBIR -->
<div id="subir" class="section fade-in">
  <h2>Subir episodio</h2>
  <input id="title"><br>
  <input id="audioURL"><br>
  <button onclick="addPodcast()">Subir</button>
</div>

<!-- NOSOTROS -->
<div id="nosotros" class="section fade-in">
  <h2>¿Quiénes somos?</h2>

  <h3>Misión</h3>
  <p>Crear un espacio cercano...</p>

  <h3>Visión</h3>
  <p>Ser un referente...</p>
</div>

<!-- COMUNIDAD -->
<div id="comunidad" class="section fade-in">
  <h2>Comunidad</h2>
</div>

<script>

/* ===== FIREBASE ===== */
const firebaseConfig={apiKey:"AIza..."};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

/* ===== CAMBIO DE SECCIÓN ===== */
function show(section){
 document.querySelectorAll(".section").forEach(s=>{
  s.classList.remove("active");
 });

 setTimeout(()=>{
  document.getElementById(section).classList.add("active");
 },150);
}

/* ===== EFECTO 3D ===== */
const logo=document.querySelector(".uni-img");

logo.addEventListener("mousemove",e=>{
 const rect=logo.getBoundingClientRect();
 const x=e.clientX-rect.left;
 const y=e.clientY-rect.top;
 const cx=rect.width/2;
 const cy=rect.height/2;

 logo.style.transform=
 `rotateX(${-(y-cy)/8}deg) rotateY(${(x-cx)/8}deg) scale(1.05)`;
});

logo.addEventListener("mouseleave",()=>{
 logo.style.transform="rotateX(0) rotateY(0)";
});

/* ===== SCROLL ANIMADO ===== */
const observer=new IntersectionObserver(entries=>{
 entries.forEach(entry=>{
  if(entry.isIntersecting){
    entry.target.classList.add("visible");
  }
 });
});

document.querySelectorAll(".fade-in").forEach(el=>{
 observer.observe(el);
});

</script>

</body>
</html>
