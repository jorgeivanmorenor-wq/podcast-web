<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entre Estudiantes</title>

  <!-- Estilos -->
  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      color:white;
      background: linear-gradient(-45deg, #000, #1a1a1a, #0f2027, #203a43);
      background-size: 400% 400%;
      animation: bg 12s ease infinite;
    }

    @keyframes bg {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .container{
      text-align:center;
      padding:60px 20px;
    }

    h1{
      font-size:40px;
      margin-bottom:10px;
    }

    p{
      opacity:0.8;
      margin-bottom:30px;
    }

    .btn{
      background:#00c3ff;
      padding:12px 20px;
      border-radius:10px;
      text-decoration:none;
      color:black;
      font-weight:bold;
      transition:0.3s;
    }

    .btn:hover{
      background:#00a2d6;
      transform:scale(1.05);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎙️ Entre Estudiantes</h1>
    <p>Podcast universitario sobre medicina, aprendizaje y experiencias reales</p>

    <a class="btn" href="#">Escuchar episodios</a>
  </div>
</body>
</html>
