<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entre Estudiantes</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<style>

/* ===== RESET ===== */
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui;
  color:white;
  background:linear-gradient(135deg,#000,#0b1220,#020617);
  overflow-x:hidden;
}

/* ===== PARTICLES ===== */
#particles{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

/* ===== CURSOR GLOW ===== */
.cursor-glow{
  position:fixed;
  width:200px;
  height:200px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle, rgba(183,255,0,0.15), transparent 70%);
  transform:translate(-50%,-50%);
}

/* ===== NAV ===== */
.nav{
  display:flex;
  justify-content:space-between;
  padding:20px;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(10px);
}

/* ===== MENU ===== */
.menu span{
  margin:0 10px;
  cursor:pointer;
}
.menu span:hover{color:#b7ff00}

/* ===== SECCIONES ===== */
.section{
  display:none;
  padding:50px;
  opacity:0;
  transform:scale(.98);
  transition:.4s;
}
.section.active{
  display:block;
  opacity:1;
  transform:scale(1);
}

/* ===== HERO ===== */
.hero{
  display:flex;
  justify-content:space-between;
  perspective:1000px;
}
.hero-left{
  transform:translateZ(40px);
}
.hero h1{
  font-size:80px;
}
.hero span{
  color:#b7ff00;
  text-shadow:0 0 20px #b7ff00;
}

/* ===== ORB ===== */
.orb{
  width:250px;
  height:250px;
  border-radius:50%;
  background:radial-gradient(circle,#1db954,#000);
  box-shadow:0 0 100px #1db954;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:pulse 2.5s infinite alternate, float 6s infinite;
}

@keyframes pulse{
  from{box-shadow:0 0 40px #1db954}
  to{box-shadow:0 0 120px #1db954}
}

@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-20px)}
  100%{transform:translateY(0)}
}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
}

/* ===== CARDS ===== */
.card{
  background:#111;
  border-radius:15px;
  overflow:hidden;
  transform-style:preserve-3d;
  transition:.2s;
  will-change:transform;
}
.card:hover{
  box-shadow:0 30px 60px rgba(0,0,0,0.6);
}
.card h4{color:#b7ff00}

/* ===== PLAYER ===== */
.player{
  position:fixed;
  bottom:0;
  width:100%;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
}
.player.playing{
  box-shadow:0 0 40px rgba(183,255,0,0.4);
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .hero{flex-direction:column;text-align:center}
  .hero h1{font-size:40px}
}

</style>
</head>

<body>

<!-- NUEVO -->
<canvas id="particles"></canvas>
<div class="cursor-glow"></div>

<div class="nav">
  <div>🎧 Entre Estudiantes</div>
  <div class="menu">
    <span onclick="showSection('inicio')">Inicio</span>
    <span onclick="showSection('episodios')">Episodios</span>
    <span onclick="showSection('subir')">Subir</span>
    <span onclick="showSection('nosotros')">Nosotros</span>
  </div>
</div>

<section id="inicio" class="section active">
  <div class="hero">
    <div class="hero-left">
      <h1>ENTRE <span>ESTUDIANTES</span></h1>
      <p>Tu voz. Tu historia.</p>
    </div>
    <div class="orb">🎧</div>
  </div>
</section>

<section id="episodios" class="section">
  <h2>Episodios</h2>
  <div id="podcasts" class="grid"></div>
</section>

<section id="subir" class="section">
  <h2>Subir</h2>
  <input id="title"><br>
  <input id="audioURL"><br>
  <button onclick="addPodcast()">Subir</button>
</section>

<section id="nosotros" class="section">
  <h2>Nosotros</h2>
  <p>Somos estudiantes de medicina...</p>
</section>

<div class="player">
  <audio id="audioPlayer" controls></audio>
</div>

<script>

/* ===== FIREBASE ===== */
firebase.initializeApp({
 apiKey:"AIza...",
 authDomain:"entre-estudiantes.firebaseapp.com",
 projectId:"entre-estudiantes"
});
const db=firebase.firestore();

/* ===== NAV ===== */
function showSection(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  setTimeout(()=>document.getElementById(id).classList.add('active'),100);
}

/* ===== CURSOR GLOW ===== */
const glow=document.querySelector(".cursor-glow");
document.addEventListener("mousemove",e=>{
 glow.style.left=e.clientX+"px";
 glow.style.top=e.clientY+"px";
});

/* ===== PARTICULAS PRO ===== */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

for(let i=0;i<80;i++){
 particles.push({
  x:Math.random()*canvas.width,
  y:Math.random()*canvas.height,
  r:Math.random()*2+1,
  dx:(Math.random()-0.5)*0.6,
  dy:(Math.random()-0.5)*0.6
 });
}

function drawParticles(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 particles.forEach(p=>{
  p.x+=p.dx;
  p.y+=p.dy;

  if(p.x<0||p.x>canvas.width)p.dx*=-1;
  if(p.y<0||p.y>canvas.height)p.dy*=-1;

  ctx.beginPath();
  ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fillStyle="rgba(183,255,0,0.6)";
  ctx.fill();
 });

 for(let i=0;i<particles.length;i++){
  for(let j=i+1;j<particles.length;j++){
   let dx=particles[i].x-particles[j].x;
   let dy=particles[i].y-particles[j].y;
   let dist=Math.sqrt(dx*dx+dy*dy);

   if(dist<120){
    ctx.beginPath();
    ctx.moveTo(particles[i].x,particles[i].y);
    ctx.lineTo(particles[j].x,particles[j].y);
    ctx.strokeStyle="rgba(183,255,0,0.1)";
    ctx.stroke();
   }
  }
 }

 requestAnimationFrame(drawParticles);
}
drawParticles();

/* ===== CARDS 3D ===== */
let mouseX=0,mouseY=0;

document.addEventListener("mousemove",e=>{
 mouseX=e.clientX;
 mouseY=e.clientY;
});

function animateCards(){
 document.querySelectorAll(".card").forEach(card=>{
  const rect=card.getBoundingClientRect();
  const x=mouseX-rect.left;
  const y=mouseY-rect.top;

  const rx=-(y-rect.height/2)/25;
  const ry=(x-rect.width/2)/25;

  card.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg) scale(1.04)`;
 });

 requestAnimationFrame(animateCards);
}
animateCards();

/* ===== PARALLAX HERO ===== */
document.addEventListener("mousemove",e=>{
 const hero=document.querySelector(".hero-left");
 if(!hero)return;

 const x=(e.clientX/window.innerWidth-0.5)*20;
 const y=(e.clientY/window.innerHeight-0.5)*20;

 hero.style.transform=`translate(${x}px,${y}px)`;
});

/* ===== RESIZE ===== */
window.addEventListener("resize",()=>{
 canvas.width=window.innerWidth;
 canvas.height=window.innerHeight;
});

/* ===== SUBIR ===== */
function addPodcast(){
 db.collection("podcasts").add({
  title:title.value,
  url:audioURL.value,
  time:Date.now()
 });
}

/* ===== LISTAR ===== */
db.collection("podcasts").orderBy("time","desc")
.onSnapshot(snap=>{
 podcasts.innerHTML="";
 snap.forEach(doc=>{
  const d=doc.data();
  podcasts.innerHTML+=`
  <div class="card" onclick="play('${d.url}')">
    <h4>${d.title}</h4>
  </div>`;
 });
});

/* ===== PLAYER ===== */
function play(url){
 const a=document.getElementById("audioPlayer");
 a.src=url;
 a.play();
 document.querySelector(".player").classList.add("playing");
}

</script>

</body>
</html>
