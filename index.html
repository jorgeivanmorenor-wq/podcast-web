<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entre Estudiantes</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<style>

/* ===== BASE ORIGINAL ===== */
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui;
  color:white;
  background:linear-gradient(135deg,#000,#0b1220,#020617);
  overflow-x:hidden;
}

/* ===== PARTICLES ===== */
#particles{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

/* ===== GLOW ===== */
.cursor-glow{
  position:fixed;
  width:200px;
  height:200px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle, rgba(183,255,0,0.15), transparent 70%);
}

/* ===== NAV ===== */
.nav{
  display:flex;
  justify-content:space-between;
  padding:20px;
  background:rgba(0,0,0,0.6);
}

/* ===== SECCIONES ===== */
.section{display:none;padding:50px}
.section.active{display:block}

/* ===== HERO ===== */
.hero{
  display:flex;
  justify-content:space-between;
  perspective:1000px;
}
.hero-left{transform:translateZ(40px)}
.hero h1{font-size:80px}
.hero span{color:#b7ff00}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
}

/* ===== CARDS ===== */
.card{
  background:#111;
  border-radius:15px;
  overflow:hidden;
  transform-style:preserve-3d;
  transition:.2s;
}
.card:hover{box-shadow:0 30px 60px black}

.card img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.card .meta{padding:10px}
.card h4{color:#b7ff00}
.card p{font-size:14px;opacity:.8}

/* ===== PLAYER ===== */
.player{
  position:fixed;
  bottom:0;
  width:100%;
  background:rgba(0,0,0,0.7);
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .hero{flex-direction:column;text-align:center}
  .hero h1{font-size:40px}
}

</style>
</head>

<body>

<canvas id="particles"></canvas>
<div class="cursor-glow"></div>

<div class="nav">
  <div>🎧 Entre Estudiantes</div>
  <div>
    <span onclick="show('inicio')">Inicio</span>
    <span onclick="show('episodios')">Episodios</span>
    <span onclick="show('subir')">Subir</span>
    <span onclick="show('nosotros')">Nosotros</span>
  </div>
</div>

<section id="inicio" class="section active">
  <div class="hero">
    <div class="hero-left">
      <h1>ENTRE <span>ESTUDIANTES</span></h1>
      <p>Tu voz. Tu historia.</p>
    </div>
  </div>
</section>

<section id="episodios" class="section">
  <h2>Episodios</h2>
  <div id="podcasts" class="grid"></div>
</section>

<section id="subir" class="section">
  <h2>Subir</h2>
  <input id="title"><br>
  <input id="audioURL"><br>
  <input id="imageURL"><br>
  <input id="desc"><br>
  <button onclick="addPodcast()">Subir</button>
</section>

<section id="nosotros" class="section">
  <h2>Nosotros</h2>
  <p>Somos estudiantes de medicina...</p>

  <h3>Misión</h3>
  <p>Crear un espacio de apoyo académico.</p>

  <h3>Visión</h3>
  <p>Ser referencia en educación médica.</p>
</section>

<div class="player">
  <audio id="audioPlayer" controls></audio>
</div>

<script>

/* ===== FIREBASE ===== */
firebase.initializeApp({
 apiKey:"AIza...",
 authDomain:"entre-estudiantes.firebaseapp.com",
 projectId:"entre-estudiantes"
});
const db=firebase.firestore();

/* ===== NAV ===== */
function show(id){
 document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}

/* ===== GLOW ===== */
const glow=document.querySelector(".cursor-glow");
document.addEventListener("mousemove",e=>{
 glow.style.left=e.clientX+"px";
 glow.style.top=e.clientY+"px";
});

/* ===== PARTICULAS ===== */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let particles=[];
for(let i=0;i<80;i++){
 particles.push({
  x:Math.random()*canvas.width,
  y:Math.random()*canvas.height,
  dx:(Math.random()-0.5)*0.5,
  dy:(Math.random()-0.5)*0.5
 });
}

function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 particles.forEach(p=>{
  p.x+=p.dx;
  p.y+=p.dy;

  ctx.beginPath();
  ctx.arc(p.x,p.y,2,0,Math.PI*2);
  ctx.fillStyle="#b7ff00";
  ctx.fill();
 });

 requestAnimationFrame(draw);
}
draw();

/* ===== CARDS 3D ===== */
document.addEventListener("mousemove",e=>{
 document.querySelectorAll(".card").forEach(card=>{
  const r=card.getBoundingClientRect();
  const x=e.clientX-r.left;
  const y=e.clientY-r.top;

  const rx=-(y-r.height/2)/25;
  const ry=(x-r.width/2)/25;

  card.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;
 });
});

/* ===== SUBIR ===== */
function addPodcast(){
 db.collection("podcasts").add({
  title:title.value,
  url:audioURL.value,
  image:imageURL.value,
  desc:desc.value,
  time:Date.now()
 });
}

/* ===== LISTAR ===== */
db.collection("podcasts").orderBy("time","desc")
.onSnapshot(snap=>{
 podcasts.innerHTML="";
 snap.forEach(doc=>{
  const d=doc.data();

  podcasts.innerHTML+=`
  <div class="card" onclick="play('${d.url}')">
    <img src="${d.image || ''}">
    <div class="meta">
      <h4>${d.title}</h4>
      <p>${d.desc || ''}</p>
    </div>
  </div>`;
 });
});

/* ===== PLAYER ===== */
function play(url){
 const a=document.getElementById("audioPlayer");
 a.src=url;
 a.play();
}

</script>

</body>
</html>
