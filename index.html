<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Entre Estudiantes</title>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #121212;
      color: white;
    }

    .header {
      background: black;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    input {
      padding: 10px;
      margin: 5px;
      border-radius: 20px;
      border: none;
      width: 70%;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      background: #1DB954;
      border: none;
      color: white;
      border-radius: 20px;
      cursor: pointer;
    }

    button:hover {
      background: #17a44b;
    }

    .card {
      background: #181818;
      border-radius: 15px;
      padding: 15px;
      margin: 15px 0;
      transition: 0.3s;
    }

    .card:hover {
      background: #282828;
    }

    .title {
      font-size: 18px;
      color: #1DB954;
    }

    .user {
      font-size: 12px;
      opacity: 0.7;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    .comments {
      background: #000;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .chat-box {
      background: #000;
      padding: 10px;
      border-radius: 10px;
      height: 150px;
      overflow-y: auto;
    }
  </style>
</head>

<body>

<div class="header">🎧 Entre Estudiantes</div>

<div class="container">

  <button onclick="login()">Iniciar sesión</button>
  <div id="userInfo"></div>

  <h2>Agregar episodio</h2>
  <input id="title" placeholder="Título del episodio"><br>
  <input id="audioURL" placeholder="Link .mp3"><br>
  <button onclick="addPodcast()">Agregar</button>

  <h2>Episodios</h2>
  <div id="podcasts"></div>

  <h2>Chat</h2>
  <div class="chat-box" id="chatBox"></div>
  <input id="chatInput">
  <button onclick="sendMessage()">Enviar</button>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDz5tYhKP1gX2UToItY0VarGLCJLoffjbg",
  authDomain: "entre-estudiantes.firebaseapp.com",
  projectId: "entre-estudiantes"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(user => {
  document.getElementById("userInfo").innerText =
    user ? "Usuario: " + user.displayName : "";
});

function login() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

function addPodcast() {
  const title = document.getElementById("title").value;
  const url = document.getElementById("audioURL").value;

  if (!url.endsWith(".mp3")) {
    alert("Debe ser .mp3");
    return;
  }

  db.collection("podcasts").add({
    title,
    url,
    time: Date.now()
  });
}

db.collection("podcasts").orderBy("time","desc")
.onSnapshot(snapshot => {
  const container = document.getElementById("podcasts");
  container.innerHTML = "";

  snapshot.forEach(doc => {
    const data = doc.data();

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="title">${data.title}</div>
      <audio controls src="${data.url}"></audio>
    `;

    container.appendChild(div);
  });
});

function sendMessage() {
  const text = document.getElementById("chatInput").value;

  db.collection("chat").add({
    text,
    time: Date.now()
  });

  document.getElementById("chatInput").value = "";
}

db.collection("chat").orderBy("time")
.onSnapshot(snapshot => {
  const box = document.getElementById("chatBox");
  box.innerHTML = "";

  snapshot.forEach(doc => {
    const p = document.createElement("p");
    p.textContent = doc.data().text;
    box.appendChild(p);
  });
});
</script>

</body>
</html>
